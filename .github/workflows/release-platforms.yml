name: Release portability

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  full-backends:
    name: Full feature and accelerator regressions
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      validation-tier: release
      timeout-minutes: 45
      command: |
        cargo test --locked -p challenge-solvers --all-features
        cargo test --locked -p challenge-protocols --all-features
        cargo test --locked -p challenge-hashx --all-features

  wasm-simd:
    name: WASM SIMD128 cross-compile
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      validation-tier: release
      rust-targets: "wasm32-wasip1"
      rustflags: "-C target-feature=+simd128"
      timeout-minutes: 30
      command: |
        cargo check --locked --target wasm32-wasip1 -p challenge-solvers --no-default-features --features std,compare-64bit

  arm64:
    name: AArch64 portable CPU compile
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      validation-tier: release
      rust-targets: "aarch64-unknown-linux-gnu"
      rustflags: ""
      timeout-minutes: 30
      command: |
        cargo check --locked --target aarch64-unknown-linux-gnu -p challenge-solvers --no-default-features --features std,compare-64bit
        cargo check --locked --target aarch64-unknown-linux-gnu -p anubis-argon2
