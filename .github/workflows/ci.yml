name: Solver CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simd-kernels:
    name: Portable-SIMD CPU kernel tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@c6fcb5f8920460c109ee87152506c3d97889ed4e # main
    with:
      rust-toolchain: "nightly-2026-11-03"
      rust-components: "rustfmt"
      timeout-minutes: 15
      command: |
        cargo fmt --all -- --check
        cargo test --locked -p challenge-solvers --no-default-features --features std,runtime-dispatch,all-challenges,compare-64bit

  protocol-solvers:
    name: Reusable protocol and Argon2 tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@c6fcb5f8920460c109ee87152506c3d97889ed4e # main
    with:
      rust-toolchain: "nightly-2026-11-03"
      timeout-minutes: 15
      command: |
        # Protocol acceptance is correctness-only; the separate SIMD kernel
        # lane tests optimized code. Keep this large link below runner limits.
        export CARGO_PROFILE_TEST_OPT_LEVEL=0 CARGO_PROFILE_TEST_DEBUG=0 CARGO_BUILD_JOBS=2
        cargo test --locked -p challenge-protocols
        cargo test --locked -p challenge-hashx --no-default-features
        cargo test --locked -p anubis-argon2

  strict-rust:
    name: Strict Rust policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@5b17a2f45f7a9934655e1d6de35e391c306c40d9 # main
    with:
      cargo-args: "--locked --workspace --all-targets --all-features"
      ban-python-outside-ci: true
