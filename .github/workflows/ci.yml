name: Solver CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simd-kernels:
    name: Portable-SIMD CPU kernel tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@db22785ec97c653cf0ec96b6964ded8158436f3c # main
    with:
      rust-components: "rustfmt"
      timeout-minutes: 15
      command: |
        cargo fmt --all -- --check
        cargo test --locked -p challenge-solvers --no-default-features --features std,runtime-dispatch,all-challenges,compare-64bit

  protocol-solvers:
    name: Reusable protocol and Argon2 tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@db22785ec97c653cf0ec96b6964ded8158436f3c # main
    with:
      timeout-minutes: 15
      command: |
        # Protocol acceptance is correctness-only; the separate SIMD kernel
        # lane tests optimized code. Keep this large link below runner limits.
        export CARGO_PROFILE_TEST_OPT_LEVEL=0 CARGO_PROFILE_TEST_DEBUG=0 CARGO_BUILD_JOBS=2
        cargo test --locked -p challenge-protocols
        # The WGPU protocol parser/routing tests need the GPU feature but
        # not an actual GPU. Keep this on ordinary Linux CI.
        cargo test --locked -p challenge-protocols --features gpu altcha_gpu_
        cargo test --locked -p challenge-solvers --features gpu pbkdf2_u1_salt_blocks_have_correct_padding_and_bit_length
        cargo test --locked -p challenge-hashx --no-default-features
        cargo test --locked -p anubis-argon2

  miri:
    name: Miri CPU memory model (Tree Borrows)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@db22785ec97c653cf0ec96b6964ded8158436f3c # main
    with:
      rust-components: "miri rust-src"
      timeout-minutes: 15
      command: |
        export MIRIFLAGS="-Zmiri-tree-borrows"
        cargo miri setup
        cargo miri test --locked -p scrypt-fast --lib tests::small_workspace_reuse_matches_reference -- --exact
        cargo miri test --locked -p challenge-solvers --no-default-features --features std,runtime-dispatch --lib sha256::sha_ni::layout_tests::portable_state_helpers_preserve_sha_ni_layout -- --exact

  strict-rust:
    name: Strict Rust policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@ccfa9833ce7f04c074194ace7b42ab89d91ecc9d # main
    with:
      cargo-args: "--locked --workspace --all-targets --all-features"
      ban-python-outside-ci: true
