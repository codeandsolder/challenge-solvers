[package]
name = "challenge-protocols"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Protocol-level proof-of-work solvers built on optimized shared Rust kernels"
repository = "https://github.com/codeandsolder/challenge-solvers"
publish = false

[features]
gpu = ["challenge-solvers/gpu", "challenge-solvers/compare-64bit"]

[dependencies]
anyhow = "1"
base64 = "0.22"
blake2 = { version = "0.11", default-features = false }
equix = "0.8"
getrandom = "0.3"
num-traits = "0.2"
argon2-rust = { version = "1.1.0", default-features = false, features = ["std"] }
anubis-argon2 = { path = "../anubis-argon2" }
challenge-solvers = { path = "../challenge-solvers", default-features = false, features = ["std", "runtime-dispatch", "all-challenges"] }
hashwx = { git = "https://github.com/codeandsolder/hashwx-rs", rev = "9c69f0f8a30d4528c46c39ce1972eea1cde8e177", default-features = false, features = ["native", "hashx"] }
hex = "0.4"
itoa = "1"
pbkdf2 = "0.13"
scrypt = "0.12"
scrypt-fast = { path = "../scrypt-fast" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", default-features = false }
sha2 = "0.11"
rug = { version = "1.30.0", default-features = false, features = ["integer", "std"] }

[dev-dependencies]
argon2 = "0.6.0"

[lints]
workspace = true
